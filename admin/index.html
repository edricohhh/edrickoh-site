<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Edric Koh — Site admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Lora:wght@400;600&display=swap">
<style>
  body{margin:0;background:#f3f2f2;font-family:"Lora",Georgia,serif}
  #gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#f3f2f2;padding:24px}
  #gate .box{max-width:380px;width:100%;text-align:center}
  #gate h1{font-family:"Cormorant Garamond",serif;font-weight:300;font-size:38px;margin:0 0 10px;color:#201f1d}
  #gate p{font-size:14px;color:rgba(32,31,29,.65);margin:0 0 28px;line-height:1.6}
  #gate button{cursor:pointer;background:none;border:1px solid #b68235;color:#7d5411;padding:13px 28px;border-radius:4px;font-family:"Cormorant Garamond",serif;font-size:15px;letter-spacing:.16em;text-transform:uppercase;transition:background .3s ease}
  #gate button:hover{background:rgba(182,130,53,.1)}
  #gate .mark{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:#7d5411;margin-bottom:18px}
</style>
</head>
<body>
<div id="gate">
  <div class="box">
    <div class="mark">Private</div>
    <h1>Site admin</h1>
    <p>Sign in to edit photos and words. Changes publish to the live site in about a minute.</p>
    <button type="button" onclick="if(window.netlifyIdentity){netlifyIdentity.open('login')}else{alert('Identity is still loading — try again in a moment.')}">Log in</button>
  </div>
</div>

<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
<script>
  var gate = document.getElementById('gate');
  if (window.netlifyIdentity) {
    netlifyIdentity.on('init', function (user) { if (user) gate.remove(); });
    netlifyIdentity.on('login', function () { gate.remove(); window.location.reload(); });
    netlifyIdentity.on('logout', function () { window.location.reload(); });
  }
</script>
</body>
</html>
